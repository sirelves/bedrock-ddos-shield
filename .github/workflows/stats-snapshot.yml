name: stats snapshot

# Captures GitHub's free adoption metrics daily and commits them to stats/,
# so the 14-day traffic window never loses history. No telemetry — this only
# reads data GitHub already keeps about the public repo.

on:
  schedule:
    - cron: "17 6 * * *"   # 06:17 UTC daily (~03:17 BRT)
  workflow_dispatch:        # run manually from the Actions tab

permissions:
  contents: write

concurrency:
  group: stats-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Collect stats
        # STATS_TOKEN (a PAT with repo scope) is used if set; otherwise the
        # built-in GITHUB_TOKEN, which can read this repo's own traffic.
        env:
          GH_TOKEN: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}
        run: python3 scripts/snapshot.py "${{ github.repository }}"

      - name: Render chart
        run: python3 scripts/plot.py

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stats/
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "stats: daily snapshot $(date -u +%Y-%m-%d)"
            git push
          fi
