# bedrock-ddos-shield — kernel network tuning for pps floods.
# EN: bigger backlog + more work per softirq poll so a pps spike doesn't overflow
#     the per-CPU input queue and drop real players along with the flood.
# PT: backlog maior + mais trabalho por poll de softirq pra um pico de pps nao
#     estourar a fila de entrada e derrubar jogador junto com o flood.
net.core.netdev_max_backlog=32768
net.core.netdev_budget=1200
net.core.netdev_budget_usecs=8000
